spring.application.name=gestion-solicitudes
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/solicitudes_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Paginación:
spring.data.web.pageable.max-page-size=100

# API externa (JSONPlaceholder)
external.jsonplaceholder.base-url=https://jsonplaceholder.typicode.com
external.jsonplaceholder.connect-timeout=3s
external.jsonplaceholder.read-timeout=5s

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Seguridad JWT
app.jwt.secret=${JWT_SECRET:ZGV2LXNlY3JldC1rZXktcGFyYS1nZXN0aW9uLXNvbGljaXR1ZGVzLTIwMjY=}
app.jwt.expiration=1h

# Usuarios de demostración (en memoria)
app.security.admin-password=${ADMIN_PASSWORD:Admin123*}
app.security.user-password=${USER_PASSWORD:Usuario123*}

# ===== Logging =====
logging.level.root=INFO
logging.level.com.evaluacion.gestion_solicitudes=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# Consola: legible para humanos, mostrando el requestId
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:-sin-request}] %-40.40logger{39} : %m%n

# Archivo: JSON estructurado (formato ECS) para herramientas de monitoreo
logging.file.name=logs/gestion-solicitudes.log
logging.structured.format.file=ecs

# ===== Actuator /info =====
management.info.env.enabled=true
management.info.java.enabled=true
info.app.name=gestion-solicitudes
info.app.description=API REST de gestión de solicitudes y centros de costo
info.app.version=1.0.0